name: CI

# Pull requests only: pushes to master are built (with the same checks) by
# deploy-cloudflare.yml.
on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Custom domain (dharmagranth.dev) serves from the root — no repo base path.
  NEXT_PUBLIC_BASE_PATH: ""
  NEXT_PUBLIC_SITE_URL: https://dharmagranth.dev

jobs:
  validate:
    name: Validate static export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          # Full history: the sitemap's lastmod dates come from git log.
          # blob:none (partial clone) keeps the multi-GB history's blobs off the
          # runner: lastmod only reads commit metadata, never old file contents.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Restore TypeScript buildinfo
        id: tsbuildinfo
        uses: actions/cache/restore@v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-

      - name: Type check
        run: npm run typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Save TypeScript buildinfo
        if: steps.tsbuildinfo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ github.sha }}

      - name: Sitemap tests
        run: npm run test:sitemap

      # Same cache as deploy-cloudflare.yml. Saved before the export so a
      # later check failure does not discard the images.
      - name: Restore verse share images
        id: og-verse
        uses: actions/cache/restore@v4
        with:
          path: public/og/verse
          key: og-verse-${{ hashFiles('scripts/generate-og-images.ts', 'lib/verse-paths.ts', 'lib/verse-pages.ts') }}-${{ hashFiles('public/data/scriptures-full/*.json') }}
          restore-keys: |
            og-verse-${{ hashFiles('scripts/generate-og-images.ts', 'lib/verse-paths.ts', 'lib/verse-pages.ts') }}-
            og-verse-

      - name: Shard scriptures for share images
        run: npm run shard:scriptures

      - name: Draw changed verse share images
        run: npm run og:verses

      - name: Save verse share images
        if: steps.og-verse.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/og/verse
          key: og-verse-${{ hashFiles('scripts/generate-og-images.ts', 'lib/verse-paths.ts', 'lib/verse-pages.ts') }}-${{ hashFiles('public/data/scriptures-full/*.json') }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: dist/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.js') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'lib/**/*.ts', 'lib/**/*.tsx', 'data/**/*.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.js') }}-
            nextjs-${{ runner.os }}-

      - name: Build static export
        # postbuild runs the export checks, prune and Cloudflare size limits.
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Upload static export artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-export
          path: dist
          retention-days: 1

  browser-tests:
    name: Browser tests (Shard ${{ matrix.shard }}/4)
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout test definitions only (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests
            scripts/serve-dist.mjs
            playwright.config.ts
            public/_headers
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: dist-export
          path: dist

      - name: Install Playwright test packages only
        run: npm install --no-save @playwright/test@^1.63.0 @axe-core/playwright@^4.13.0

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/**/*.ts', 'playwright.config.ts') }}

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright test shard
        run: npx playwright test --shard=${{ matrix.shard }}/4
