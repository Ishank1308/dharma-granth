name: Deploy Cloudflare Pages

# Uploads the static export to Cloudflare Pages with wrangler. Setup:
# docs/deploy-cloudflare.md.
#
# When the pushed tree is exactly the merge tree a pull request's CI run
# built and passed (ci.yml), that export is deployed as is, in a few minutes.
# Otherwise (master moved after the last CI run, CI failed, the artifact
# expired, a direct push) the export is built and checked here as before.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID;
# without them the build still runs (and checks) but nothing is deployed.

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  # Read the export ci.yml kept, then delete it once it is live.
  actions: write

concurrency:
  # Keep the active production publish running; repeated merges should not cancel
  # a slow static build before it can reach the custom domain. GitHub retains
  # only the latest pending deployment in this group.
  group: cloudflare-pages
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Custom domain (dharmagranth.dev) serves from the root — no base path.
  NEXT_PUBLIC_BASE_PATH: ""
  NEXT_PUBLIC_SITE_URL: https://dharmagranth.dev
  CLOUDFLARE_PROJECT: dharma-granth
  # Verse share images are uploaded as the project's `share` branch deployment and
  # linked from here (docs/deploy-cloudflare.md, "Verse share images"). Keep the
  # same value in ci.yml: the export CI builds is the one that goes live.
  NEXT_PUBLIC_SHARE_IMAGE_ORIGIN: https://share.dharma-granth.pages.dev

jobs:
  build-deploy:
    name: Build and deploy
    # workflow_dispatch can target other refs. Never publish those as master.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      - name: Find the export CI built for this tree
        id: prebuilt
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: commit } = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
            const name = `dist-tree-${commit.tree.sha}`;
            const { data } = await github.rest.actions.listArtifactsForRepo({ owner, repo, name, per_page: 20 });
            const repoId = context.payload.repository.id;
            for (const artifact of data.artifacts) {
              const run = artifact.workflow_run;
              // Only runs on branches of this repository: a fork's pull request
              // could edit ci.yml and upload anything under this name.
              if (artifact.expired || !run || run.repository_id !== repoId || run.head_repository_id !== repoId) continue;
              const { data: ci } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
              if (ci.path !== '.github/workflows/ci.yml' || ci.conclusion !== 'success') continue;
              core.info(`Reusing ${name} from ${ci.html_url}`);
              core.setOutput('run-id', String(run.id));
              core.setOutput('artifact-id', String(artifact.id));
              core.setOutput('name', name);
              return;
            }
            core.info(`No passed CI export for tree ${commit.tree.sha}; building here.`);

      # The export is already built: check out only what the deploy and the
      # checks after it read (Pages Functions and three dependency-free
      # scripts), not the ~550 MB tree. Saves about a minute, plus npm ci.
      # No package.json on purpose: wrangler-action would then install the
      # site's 550 packages along with Wrangler.
      - name: Checkout (prebuilt export)
        if: steps.prebuilt.outputs.run-id != ''
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /functions/
            /lib/
            /tsconfig.json
            /scripts/smoke-test-dist.mjs
            /scripts/verify-rsc-canary.mjs
            /scripts/seo/
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Checkout
        if: steps.prebuilt.outputs.run-id == ''
        uses: actions/checkout@v6
        with:
          lfs: true
          # Full history: the sitemap's lastmod dates come from git log.
          # Keep the full checkout: combining a partial clone with lfs: true
          # makes Git LFS fail to scan the tree on the Actions runner.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          # No lockfile in the prebuilt checkout.
          cache: ${{ steps.prebuilt.outputs.run-id == '' && 'npm' || '' }}

      # Wrangler --branch=master is a preview when the Pages project's production
      # branch points elsewhere. A preview can upload successfully while the
      # custom domain continues serving stale RSC payloads. Ensure the server-
      # side project setting agrees with this master-only deployment workflow.
      # Cloudflare: https://developers.cloudflare.com/pages/configuration/branch-build-controls/
      - name: Ensure Cloudflare Pages production branch is master
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT}"
          current="$(curl --fail-with-body --silent --show-error "$api" \
            --header "Authorization: Bearer ${CF_API_TOKEN}")"
          branch="$(jq -r 'if .success == true then .result.production_branch // empty else empty end' <<<"$current")"
          if [[ -z "$branch" ]]; then
            echo "::error::Unable to read Cloudflare Pages project production_branch; refusing a potentially preview-only deployment."
            exit 1
          fi
          echo "::notice::Cloudflare Pages configured production branch: ${branch}"
          if [[ "$branch" != "master" ]]; then
            echo "::warning::Repairing Cloudflare Pages production branch to master, matching this repository's release branch."
            updated="$(curl --fail-with-body --silent --show-error --request PATCH "$api" \
              --header "Authorization: Bearer ${CF_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{"production_branch":"master"}')"
            if ! jq -e '.success == true and .result.production_branch == "master"' <<<"$updated" >/dev/null; then
              echo "::error::Cloudflare Pages did not confirm the master production branch; refusing to deploy."
              exit 1
            fi
            echo "::notice::Cloudflare Pages production branch corrected to master."
          fi

      - name: Install dependencies
        if: steps.prebuilt.outputs.run-id == ''
        run: npm ci

      - name: Lint
        if: steps.prebuilt.outputs.run-id == ''
        run: npm run lint

      - name: Restore TypeScript buildinfo
        if: steps.prebuilt.outputs.run-id == ''
        id: tsbuildinfo
        uses: actions/cache/restore@v5
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-

      - name: Type check
        if: steps.prebuilt.outputs.run-id == ''
        run: npm run typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Save TypeScript buildinfo
        if: steps.prebuilt.outputs.run-id == '' && steps.tsbuildinfo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ github.sha }}

      - name: Sitemap tests
        if: steps.prebuilt.outputs.run-id == ''
        run: npm run test:sitemap

      # Drawing all ~2,300 verse images takes ~3.5 minutes. Save the cache in
      # its own step: the combined cache action only stores a cache when the
      # job succeeds, so a later export failure used to throw the images away
      # and the next push drew them all again.
      - name: Restore verse share images
        if: steps.prebuilt.outputs.run-id == ''
        id: og-verse
        uses: actions/cache/restore@v5
        with:
          path: public/og/verse
          key: og-verse-${{ hashFiles('scripts/generate-og-images.ts', 'lib/verse-paths.ts', 'lib/verse-pages.ts') }}-${{ hashFiles('public/data/scriptures-full/*.json', 'public/data/scriptures-full/*.json.gz') }}
          restore-keys: |
            og-verse-${{ hashFiles('scripts/generate-og-images.ts', 'lib/verse-paths.ts', 'lib/verse-pages.ts') }}-
            og-verse-

      - name: Shard scriptures for share images
        if: steps.prebuilt.outputs.run-id == ''
        run: npm run shard:scriptures

      - name: Draw changed verse share images
        if: steps.prebuilt.outputs.run-id == ''
        run: npm run og:verses

      - name: Save verse share images
        if: steps.prebuilt.outputs.run-id == '' && steps.og-verse.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: public/og/verse
          key: og-verse-${{ hashFiles('scripts/generate-og-images.ts', 'lib/verse-paths.ts', 'lib/verse-pages.ts') }}-${{ hashFiles('public/data/scriptures-full/*.json', 'public/data/scriptures-full/*.json.gz') }}

      # Next deletes dist/ but keeps dist/cache. This shortens the compile.
      # Static pages are still generated.
      - name: Cache Next.js build
        if: steps.prebuilt.outputs.run-id == ''
        uses: actions/cache@v5
        with:
          path: dist/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.js') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'lib/**/*.ts', 'lib/**/*.tsx', 'data/**/*.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.js') }}-
            nextjs-${{ runner.os }}-

      - name: Build static export
        if: steps.prebuilt.outputs.run-id == ''
        # prebuild: data publish + checks + verse images.
        # postbuild: export checks, prune, Cloudflare size limits.
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Download the CI export
        if: steps.prebuilt.outputs.run-id != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.prebuilt.outputs.name }}
          run-id: ${{ steps.prebuilt.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Unpack the CI export
        if: steps.prebuilt.outputs.run-id != ''
        run: zstd -d -q -c dist.tar.zst | tar -xf - && rm dist.tar.zst

      # One image per verse page would take the site past Cloudflare's 20,000
      # files per deployment, so they go up as their own deployment: the `share`
      # branch of the same project, with its own 20,000 files. Pages link to them
      # at NEXT_PUBLIC_SHARE_IMAGE_ORIGIN; addresses shared before the split
      # (dharmagranth.dev/og/verse/...) redirect there.
      - name: Split verse share images from the site export
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p share-images/og
          mv dist/og/verse share-images/og/verse
          printf '/*\n  Cache-Control: public, max-age=86400\n  X-Content-Type-Options: nosniff\n' > share-images/_headers
          printf '\n/og/verse/* %s/og/verse/:splat 301\n' "$NEXT_PUBLIC_SHARE_IMAGE_ORIGIN" >> dist/_redirects
          # -print -quit, not "| head -n 1": head closing the pipe early makes
          # find or sort fail with SIGPIPE, which pipefail turns into a failed step.
          sample="$(cd share-images && find og/verse -type f -name '*.jpg' -print -quit)"
          if [[ -z "$sample" ]]; then
            echo "::error::No verse share images in the export; the site was not deployed."
            exit 1
          fi
          echo "SHARE_IMAGE_SAMPLE=$sample" >> "$GITHUB_ENV"
          echo "Share images: $(find share-images/og -type f | wc -l). Site files: $(find dist -type f | wc -l)."

      # Runs inside share-images/, which has no functions/ folder, so this
      # deployment is images only. Unchanged images are not uploaded again.
      - name: Deploy verse share images
        id: share
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.2"
          workingDirectory: share-images
          command: pages deploy . --project-name=${{ env.CLOUDFLARE_PROJECT }} --branch=share --commit-dirty=true

      - name: Retry deploy of verse share images
        if: steps.share.outcome == 'failure'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.2"
          workingDirectory: share-images
          command: pages deploy . --project-name=${{ env.CLOUDFLARE_PROJECT }} --branch=share --commit-dirty=true

      # The site must not go live pointing at images that are not there.
      - name: Check a verse share image is being served
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="${NEXT_PUBLIC_SHARE_IMAGE_ORIGIN}/${SHARE_IMAGE_SAMPLE}"
          for attempt in 1 2 3 4 5 6; do
            type="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code} %{content_type}' "$url" || true)"
            echo "Attempt ${attempt}: ${url} -> ${type}"
            if [[ "$type" == "200 image/jpeg"* ]]; then exit 0; fi
            sleep 10
          done
          echo "::error::Verse share images are not being served at ${NEXT_PUBLIC_SHARE_IMAGE_ORIGIN}; the site was not deployed."
          exit 1

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin the current Wrangler 4 uploader so deploy behaviour is
          # reproducible and benefits from the latest Pages upload fixes.
          wranglerVersion: "4.151.2"
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT }} --branch=master --commit-dirty=true

      # Cloudflare sometimes answers "Failed to publish your Function: Unknown
      # internal error" (it kept PR #62 off the live site on 2026-11-06).
      # Uploaded files are kept, so a second try takes under a minute.
      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Retry deploy to Cloudflare Pages
        id: retry_deploy
        if: steps.deploy.outcome == 'failure'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.2"
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT }} --branch=master --commit-dirty=true

      # Tell IndexNow (Bing and others) which pages changed; never fails the deploy.
      - name: Notify IndexNow
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        continue-on-error: true
        run: node scripts/seo/indexnow.mjs --send

      - name: Note missing secrets
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: echo "::notice::Built and checked, not deployed — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/deploy-cloudflare.md)."

      # Lightweight post-deploy smoke test of dist/
      # Verifies HTTP 200, valid HTML content, and zero Error Boundary text across core routes
      - name: Post-deploy health smoke test
        run: node scripts/smoke-test-dist.mjs

      # Compare the deployed Flight payload with the exact dist artifact from
      # this run. This catches stale or mismatched RSC files before any R2
      # canary is enabled.
      - name: Verify deployed RSC payload parity
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        # Check the immutable deployment first to distinguish a bad upload from
        # a stale custom-domain route or an R2 canary serving old payload bytes.
        env:
          IMMUTABLE_DEPLOY_URL: ${{ steps.retry_deploy.outputs.deployment-url || steps.deploy.outputs.deployment-url }}
        run: |
          if [[ -n "$IMMUTABLE_DEPLOY_URL" ]]; then
            echo "::notice::Checking immutable Pages deployment parity: $IMMUTABLE_DEPLOY_URL"
            # Wrangler may announce completion a few seconds before the immutable
            # hostname starts serving files. Retry the same strict byte check;
            # never treat a persistent 404 or mismatch as success.
            immutable_ready=false
            for attempt in {1..12}; do
              if node scripts/verify-rsc-canary.mjs \
                --local dist/scripture/bhagavadgita/chapter/2/index.txt \
                --url "${IMMUTABLE_DEPLOY_URL%/}/scripture/bhagavadgita/chapter/2/index.txt"; then
                immutable_ready=true
                break
              fi
              if [ "$attempt" -lt 12 ]; then
                echo "::warning::Immutable deployment is not ready on attempt $attempt; retrying in 10 seconds."
                sleep 10
              fi
            done
            if [[ "$immutable_ready" != true ]]; then
              echo "::error::Immutable Pages deployment did not reach strict RSC parity after the propagation window."
              exit 1
            fi
          else
            echo "::warning::Wrangler did not expose an immutable deployment URL; custom-domain check still required."
          fi
          # Keep strict byte-level verification of the actual public hostname.
          # An alias passing does not make stale public RSC safe to release.
          for attempt in {1..16}; do
            if node scripts/verify-rsc-canary.mjs --local dist/scripture/bhagavadgita/chapter/2/index.txt --url https://dharmagranth.dev/scripture/bhagavadgita/chapter/2/index.txt; then
              exit 0
            fi
            if [ "$attempt" -eq 16 ]; then
              echo "::error::Custom-domain RSC payload did not match the build after the propagation window; inspect X-Dharma-RSC-Source and immutable check above."
              exit 1
            fi
            echo "::warning::Public RSC parity attempt $attempt has not matched yet; checking again in 20 seconds."
            sleep 20
          done

      # The export is live; stop paying to store it.
      - name: Delete the used CI export
        if: env.HAS_CLOUDFLARE_SECRETS == 'true' && steps.prebuilt.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.prebuilt.outputs.artifact-id }}
        with:
          script: |
            await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: Number(process.env.ARTIFACT_ID) });
