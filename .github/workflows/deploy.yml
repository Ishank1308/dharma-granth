name: Deploy GitHub Pages

# Retired: the export (verses in HTML + verse pages) is over GitHub Pages'
# 1 GB site limit, so it now deploys to Cloudflare Pages
# (deploy-cloudflare.yml, docs/deploy-cloudflare.md). Manual-only so pushes
# don't trigger a deploy that would be rejected; remove once Cloudflare
# serves dharmagranth.in.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Custom domain (dharmagranth.in) serves from the root — no repo base path.
  NEXT_PUBLIC_BASE_PATH: ""
  NEXT_PUBLIC_SITE_URL: https://dharmagranth.in

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          # Full history: the sitemap's lastmod dates come from git log.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build GitHub Pages export
        run: npm run build:pages
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
