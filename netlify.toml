[build]
  command = "npm run build:pages"
  publish = "dist"

[build.environment]
  NEXT_PUBLIC_BASE_PATH = ""
  NEXT_PUBLIC_SITE_URL = "https://dharmagranth.in"
  NEXT_TELEMETRY_DISABLED = "1"

[[redirects]]
  from = "/start-here"
  to = "/start/"
  status = 301
  force = true

[[redirects]]
  from = "/start-here/"
  to = "/start/"
  status = 301
  force = true

[[redirects]]
  from = "/start"
  to = "/start/"
  status = 301
  force = true

[[redirects]]
  from = "/topics"
  to = "/topics/"
  status = 301
  force = true

[[redirects]]
  from = "/sadhana"
  to = "/practice/"
  status = 301
  force = true

[[redirects]]
  from = "/sadhana/"
  to = "/practice/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
