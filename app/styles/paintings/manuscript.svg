form-origin:center;animation:smoke 9s ease-out infinite}@keyframes smoke{from{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.32}to{transform:translate(40px,-190px) scale(3.2);opacity:0}}.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 6s ease-out infinite}@keyframes ripple{from{transform:scale(.3);opacity:.8}to{transform:scale(2.4);opacity:0}}.float{animation:float 26s linear infinite}@keyframes float{from{transform:translateX(0)}to{transform:translateX(-1200px)}}.bob{animation:bob 4s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(5px)}}.bolt{animation:bolt 7s steps(1) infinite}@keyframes bolt{0%,88%,92%,100%{opacity:0}89%,91%{opacity:1}}.flash{animation:flash 7s ease-out infinite}@keyframes flash{0%,88%{opacity:0}89%{opacity:.5}100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}#still:target~*,#still:target~* *{animation:none!important}</style><defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fff1a8"/><stop offset="0.45" stop-color="#fb923c"/><stop offset="1" stop-color="#dc2626"/></linearGradient><radialGradient id="gl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient><radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe7a3" stop-opacity="0.85"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient><radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff7d6" stop-opacity="0.5"/><stop offset="1" stop-color="#fff7d6" stop-opacity="0"/></radialGradient><radialGradient id="m-sky" cx="0.62" cy="0.7" r="0.8"><stop offset="0" stop-color="#78350f"/><stop offset="0.6" stop-color="#3b1d0a"/><stop offset="1" stop-color="#1c0d04"/></radialGradient><linearGradient id="m-leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5deb3"/><stop offset="1" s