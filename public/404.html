<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — पृष्ठ नहीं मिला · Dharma Granth</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root {
      --bg: #fbf7ee;
      --card: #ffffff;
      --text: #2c2416;
      --muted: #6b6356;
      --border: #e8ded1;
      --primary: #c2410c;
      --primary-hover: #9a3412;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14110e;
        --card: #1f1b16;
        --text: #ece5d8;
        --muted: #a89d8d;
        --border: #332b22;
        --primary: #f97316;
        --primary-hover: #ea580c;
      }
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-sizing: border-box;
    }
    .container {
      max-width: 580px;
      padding: 2.5rem 1.5rem;
      margin: 0 auto;
    }
    .om {
      font-size: 4.5rem;
      color: var(--primary);
      margin-bottom: 1rem;
      line-height: 1;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin: 0 0 1rem;
      line-height: 1.2;
    }
    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 0 2rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }
    .btn-secondary {
      background-color: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background-color: var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="om" lang="sa">ॐ</div>
    <div class="badge">404 · पृष्ठ नहीं मिला</div>
    <h1>यह पृष्ठ ग्रंथालय में उपलब्ध नहीं है</h1>
    <p>
      The path you requested could not be found. Return to the sacred library or explore the Bhagavad Gita.
    </p>
    <div class="actions">
      <a href="/" class="btn btn-primary">मुख्य पृष्ठ (Home)</a>
      <a href="/scriptures" class="btn btn-secondary">ग्रंथालय (Scriptures)</a>
      <a href="/scripture/bhagavadgita" class="btn btn-secondary">श्रीमद्भगवद्गीता (Gita)</a>
    </div>
  </div>
</body>
</html>
